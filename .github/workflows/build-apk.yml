name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Android Autonome
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code
        uses: actions/checkout@v4

      - name: 2. Configuration Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Désactiver la New Architecture et nettoyer app.json
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
              delete app.expo.icon;
              delete app.expo.splash;
              if (app.expo.android) delete app.expo.android.adaptiveIcon;
              app.expo.newArchEnabled = false;
              fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            }
          '

      - name: 5. Installation des dépendances
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: 6. Génération du projet Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: 7. Permissions Linux et signature autonome
        run: |
          chmod +x android/gradlew
          echo "kotlin.daemon.jvm.options=-Xmx2048m" >> android/gradle.properties
          echo "newArchEnabled=false" >> android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' android/app/build.gradle || true

      - name: 8. Compilation de l'APK Release autonome (JavaScript embarqué)
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease --no-daemon

      - name: 9. Téléchargement du fichier APK autonome
        uses: actions/upload-artifact@v4
        with:
          name: Mon-VTC-Gestion-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
